[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "druid-to-pinot-migrator"
version = "0.1.0"
description = "Migrate Apache Druid ingestion specs to Apache Pinot artifacts"
requires-python = ">=3.11"
license = {text = "StarTree Community License"}
authors = [{name = "StarTree"}]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "pytest-rerunfailures>=14.0",
    "requests>=2.31",
    "kafka-python>=2.0",
]

[project.scripts]
dpm = "migrator.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
