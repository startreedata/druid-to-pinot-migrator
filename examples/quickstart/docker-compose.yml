version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Druid → Pinot quickstart cluster
# ─────────────────────────────────────────────────────────────────────────────
# Single-machine docker-compose stack used by the quickstart walkthrough.
# Ports follow the standard Druid + Pinot defaults so users can use any
# tool/UI that talks to those ports without configuration:
#
#   ZooKeeper:         2181
#   Postgres (Druid):  5432
#   Druid coordinator: 8081
#   Druid broker:      8082
#   Druid historical:  8083
#   Druid middleMgr:   8091
#   Druid router:      8888  (Druid Web Console)
#   Pinot controller:  9000  (Pinot Web UI)
#   Pinot broker:      8099
#   Pinot server:      8097/8098
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  metadata_data: {}
  druid_shared: {}
  coordinator_var: {}
  historical_var: {}
  broker_var: {}
  middlemanager_var: {}
  router_var: {}
  pinot_controller_data: {}

networks:
  quickstart:
    driver: bridge

services:
  zookeeper:
    image: zookeeper:3.9.5
    container_name: quickstart-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,srvr"
    networks:
      - quickstart
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15-alpine
    container_name: quickstart-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: druid
      POSTGRES_USER: druid
      POSTGRES_DB: druid
    networks:
      - quickstart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid"]
      interval: 5s
      timeout: 5s
      retries: 20

  coordinator:
    image: apache/druid:31.0.0
    container_name: quickstart-druid-coordinator
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    command: coordinator
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - coordinator_var:/opt/druid/var
      - ./data:/quickstart-data:ro
    networks:
      - quickstart
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  broker:
    image: apache/druid:31.0.0
    container_name: quickstart-druid-broker
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "8082:8082"
    command: broker
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - broker_var:/opt/druid/var
    networks:
      - quickstart
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  historical:
    image: apache/druid:31.0.0
    container_name: quickstart-druid-historical
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "8083:8083"
    command: historical
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - historical_var:/opt/druid/var
    networks:
      - quickstart
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  middlemanager:
    image: apache/druid:31.0.0
    container_name: quickstart-druid-middlemanager
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "8091:8091"
    command: middleManager
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - middlemanager_var:/opt/druid/var
      - ./data:/quickstart-data:ro
    networks:
      - quickstart
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  router:
    image: apache/druid:31.0.0
    container_name: quickstart-druid-router
    depends_on:
      broker:
        condition: service_healthy
      historical:
        condition: service_healthy
      middlemanager:
        condition: service_healthy
    ports:
      - "8888:8888"
    command: router
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - router_var:/opt/druid/var
    networks:
      - quickstart
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  pinot-controller:
    image: apachepinot/pinot:1.5.0
    container_name: quickstart-pinot-controller
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseG1GC"
    command: >
      StartController
      -zkAddress zookeeper:2181
      -clusterName quickstart-pinot
      -controllerPort 9000
      -dataDir /var/pinot/controller
    volumes:
      - pinot_controller_data:/var/pinot/controller
    networks:
      - quickstart
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  pinot-broker:
    image: apachepinot/pinot:1.5.0
    container_name: quickstart-pinot-broker
    depends_on:
      pinot-controller:
        condition: service_healthy
    ports:
      - "8099:8099"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    command: >
      StartBroker
      -zkAddress zookeeper:2181
      -clusterName quickstart-pinot
    networks:
      - quickstart
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8099/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  pinot-server:
    image: apachepinot/pinot:1.5.0
    container_name: quickstart-pinot-server
    depends_on:
      pinot-controller:
        condition: service_healthy
    ports:
      - "8097:8097"
      - "8098:8098"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    command: >
      StartServer
      -zkAddress zookeeper:2181
      -clusterName quickstart-pinot
    networks:
      - quickstart
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8097/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
