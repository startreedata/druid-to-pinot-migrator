name: Live cell (reusable)

# Reusable workflow that runs one (druid, pinot) cell of the live
# integration suite end-to-end:
#   1. free disk space (Druid + Pinot images are ~5GB combined)
#   2. install dpm + dev deps
#   3. pull the requested image versions
#   4. run the no-auth live migration suite
#   5. run the auth-enabled live suite
#   6. on failure: dump per-container logs from both stacks
#   7. always: tear down both compose stacks
#
# Called by `version-matrix.yml` (cron + push-to-main) and
# `integration.yml` (pull-request + manual). Keeping the cell runner in
# one file means changes to the bring-up / teardown / diagnostics happen
# in exactly one place.

on:
  workflow_call:
    inputs:
      druid_version:
        type: string
        required: true
      pinot_version:
        type: string
        required: true
      label:
        type: string
        required: true
      timeout_minutes:
        type: number
        required: false
        default: 45

jobs:
  live:
    name: ${{ inputs.label }} — D${{ inputs.druid_version }} P${{ inputs.pinot_version }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      DRUID_VERSION: ${{ inputs.druid_version }}
      PINOT_VERSION: ${{ inputs.pinot_version }}
      LIVE_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # GitHub runners ship with ~25GB of pre-installed software; the
          # combined Druid + Pinot images need ~5GB. Free up disk so pulls
          # don't fail mid-job.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Pull Druid + Pinot images
        run: |
          docker pull "apache/druid:${DRUID_VERSION}"
          docker pull "apachepinot/pinot:${PINOT_VERSION}"

      # ── No-auth: full live migration suite ────────────────────────────
      - name: Live integration suite (no-auth)
        # Pinot's ingestFromFile API is async — segments may take 60-300s to
        # become queryable depending on runner load. We retry failed tests
        # twice with a short delay to absorb that variance without masking
        # genuine breakage. The `--ignore=tests/docker/auth` keeps the
        # auth-enabled stack out of this step so the two compose stacks
        # don't run simultaneously and double the runner's RAM footprint.
        run: |
          pytest tests/docker \
            --ignore=tests/docker/auth \
            -v --tb=short --reruns 2 --reruns-delay 10

      # ── Auth-enabled: focused auth-path coverage ──────────────────────
      - name: Live integration suite (auth-enabled)
        # Brings up tests/docker/auth/docker-compose.yml on a separate set
        # of ports. The session-scoped `auth_docker_stack` fixture handles
        # the up/down — the previous step's no-auth stack has already been
        # torn down by its own session-end fixture.
        run: |
          pytest tests/docker/auth \
            -v --tb=short --reruns 2 --reruns-delay 10

      - name: Cluster diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps ==="
          docker ps -a
          echo
          for container in migtest-coordinator migtest-pinot-controller \
                           migtest-pinot-server authtest-coordinator \
                           authtest-pinot-controller authtest-pinot-broker; do
            if docker ps -a --format '{{.Names}}' | grep -q "^$container$"; then
              echo "=== $container (last 200 lines) ==="
              docker logs --tail=200 "$container" 2>&1 || true
              echo
            fi
          done

      - name: Tear down
        if: always()
        run: |
          ( cd tests/docker      && docker compose down -v --remove-orphans ) || true
          ( cd tests/docker/auth && docker compose down -v --remove-orphans ) || true
