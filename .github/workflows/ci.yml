name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]"

      # Coverage is measured on the canonical 3.11 cell only — running it
      # on every Python version would just duplicate identical numbers and
      # spam the PR with redundant comments.
      - name: Run unit + integration tests (with coverage)
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/unit tests/integration -v --tb=short \
            --cov --cov-report=term --cov-report=xml --cov-report=html

      - name: Run unit + integration tests
        if: matrix.python-version != '3.11'
        run: pytest tests/unit tests/integration -v --tb=short

      - name: Coverage summary → workflow run page
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          {
            echo "## Test coverage"
            echo
            echo "Generated against \`migrator/\` from unit + integration tests."
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event_name }}-${{ github.run_id }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      # Codecov: posts the diff-coverage PR comment (strictly richer than
      # what we could build by hand — has base-branch comparison and
      # links to the dashboard), and persists history so we can see the
      # metric trend across releases.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unit-integration
          fail_ci_if_error: false   # don't block CI on a transient codecov outage
          verbose: true

      - name: CLI smoke — inspect / generate / validate
        run: |
          set -euo pipefail
          dpm inspect tests/fixtures/raw_batch/spec.json --json > /tmp/inspect.json
          test "$(jq -r .datasource_name /tmp/inspect.json)" = "pageviews"

          dpm generate tests/fixtures/rolled_up/spec.json --out /tmp/smoke
          test -f /tmp/smoke/schema.json
          test -f /tmp/smoke/table-offline.json
          test -f /tmp/smoke/reports/migration-summary.md

          dpm validate tests/fixtures/raw_batch/spec.json --generated-dir /tmp/smoke --json \
            > /tmp/validate.json
          test "$(jq -r .overall_status /tmp/validate.json)" != "fail"

      - name: Verify generated kafka FQCN
        run: |
          dpm generate tests/fixtures/raw_stream/spec.json --out /tmp/stream-smoke
          # We emit kafka20 (NOT kafka30) by design — see KAFKA_CONSUMER_FACTORY
          # docstring in table_generator.py for the compatibility rationale.
          jq -e '.tableIndexConfig.streamConfigs."stream.kafka.consumer.factory.class.name"
                 | test("kafka20")' /tmp/stream-smoke/table-realtime.json
