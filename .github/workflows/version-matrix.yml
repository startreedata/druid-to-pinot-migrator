name: Version Matrix (Live Docker)

# Runs the live Druid → Pinot integration suite across a curated matrix of
# Druid and Pinot versions to validate the compatibility table in the README.
#
# Triggers
#   • weekly cron — Mondays 06:00 UTC
#   • manual dispatch — optionally restricted to a single (druid, pinot) cell
#   • on push to main when a CI-relevant file changes (post-merge sanity)
#
# PR-time runs of the same matrix live in `integration.yml`.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      druid_version:
        description: "Druid version to test (leave blank for full matrix)"
        required: false
        default: ""
      pinot_version:
        description: "Pinot version to test (leave blank for full matrix)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tests/docker/**"
      - "migrator/**"
      - ".github/workflows/version-matrix.yml"
      - ".github/workflows/_live-cell.yml"
      - "examples/quickstart/docker-compose.yml"

concurrency:
  group: version-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Build the matrix dynamically so manual dispatch can pin a single cell.
  # ────────────────────────────────────────────────────────────────────────
  build-matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        env:
          INPUT_DRUID: ${{ github.event.inputs.druid_version }}
          INPUT_PINOT: ${{ github.event.inputs.pinot_version }}
        run: |
          # Curated combinations exercising the README compatibility matrix:
          #   - current/current (primary)
          #   - current Druid x older Pinot (artifact still deploys)
          #   - older Druid x current Pinot (parser still understands spec)
          #   - lower-bound smoke
          # NOTE: keep this in sync with `integration.yml::build-matrix`
          # which uses the same cell list for PR-time coverage.
          read -r -d '' FULL <<'JSON' || true
          {
            "include": [
              {"druid": "31.0.0",  "pinot": "1.5.0", "label": "current/current"},
              {"druid": "31.0.0",  "pinot": "1.4.0", "label": "druid31/pinot14"},
              {"druid": "30.0.0",  "pinot": "1.5.0", "label": "druid30/pinot15"},
              {"druid": "28.0.1",  "pinot": "1.0.0", "label": "lower-bound"}
            ]
          }
          JSON
          if [[ -n "$INPUT_DRUID" || -n "$INPUT_PINOT" ]]; then
            DRUID="${INPUT_DRUID:-31.0.0}"
            PINOT="${INPUT_PINOT:-1.5.0}"
            MATRIX=$(jq -nc --arg d "$DRUID" --arg p "$PINOT" \
              '{include: [{druid: $d, pinot: $p, label: ($d + "/" + $p)}]}')
          else
            MATRIX=$(printf '%s' "$FULL" | jq -c .)
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $MATRIX"

  # ────────────────────────────────────────────────────────────────────────
  # One reusable-workflow call per matrix cell. The cell runner lives in
  # _live-cell.yml so changes to bring-up / tests / diagnostics / teardown
  # apply uniformly to both this scheduled matrix and the PR-time
  # `integration.yml`.
  # ────────────────────────────────────────────────────────────────────────
  live:
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    uses: ./.github/workflows/_live-cell.yml
    with:
      druid_version: ${{ matrix.druid }}
      pinot_version: ${{ matrix.pinot }}
      label: ${{ matrix.label }}

  # ────────────────────────────────────────────────────────────────────────
  # Aggregate matrix result so branch protection can require a single check.
  # ────────────────────────────────────────────────────────────────────────
  matrix-result:
    name: Matrix result
    if: always()
    needs: live
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.live.result }}" != "success" ]]; then
            echo "One or more cells failed: ${{ needs.live.result }}"
            exit 1
          fi
          echo "All matrix cells passed."
