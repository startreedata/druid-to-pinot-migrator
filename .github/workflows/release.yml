name: Release to PyPI

# Triggered when a `vX.Y.Z` tag is pushed (recommended) or a GitHub
# release is published. Tag-driven releases keep PyPI in lock-step with
# git history; release-driven publishing lets the maintainer attach
# release notes before the wheel ships.
#
# Manual `workflow_dispatch` is also supported for emergency re-publish
# (e.g. after a transient PyPI hiccup).
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0). Must match pyproject.toml."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit tests/integration -v --tb=short

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install --upgrade build

      - name: Verify pyproject version matches the trigger
        id: meta
        run: |
          PYPROJECT_VERSION=$(python3 -c "import tomllib,sys;print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          echo "version=$PYPROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $PYPROJECT_VERSION"
          # If triggered by a tag, the tag must match.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            EXPECTED="v$PYPROJECT_VERSION"
            if [[ "$TAG" != "$EXPECTED" ]]; then
              echo "::error::Tag $TAG does not match pyproject.toml version (expected $EXPECTED)"
              exit 1
            fi
          fi

      - name: Build distributions
        run: python -m build

      - name: Verify the build is consistent
        run: |
          ls -la dist/
          # Make sure both sdist and wheel were produced.
          test -n "$(ls dist/*.tar.gz 2>/dev/null)"  || (echo 'sdist missing'; exit 1)
          test -n "$(ls dist/*.whl 2>/dev/null)"     || (echo 'wheel missing'; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish is the maintained PyPA action.
        # We pass the API token explicitly via the secret added by the
        # repo admin (PYPI_TOKEN). Trusted publishing (OIDC) is an
        # alternative if the maintainer prefers; switch by removing the
        # `password` input and configuring pypi.org/manage/account/.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          # Skip uploading files that already exist on PyPI (idempotent
          # re-runs after a transient network failure).
          skip-existing: true
          verbose: true

      - name: Print summary
        run: |
          echo "Released druid-to-pinot-migrator ${{ needs.build.outputs.version }} to PyPI." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "pip install druid-to-pinot-migrator==${{ needs.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
