coverage:
  precision: 1
  round: nearest
  range: "70...90"

  status:
    # Project-wide status: informational for now (don't block PRs while
    # we ratchet the metric up). Switch to `error` once we set a target.
    project:
      default:
        target: auto
        threshold: 1.0%
        informational: true
    # Patch coverage (lines added by the PR): same — informational.
    patch:
      default:
        target: auto
        threshold: 1.0%
        informational: true

# PR comments: keep it concise — header + diff coverage. The full
# per-file table is overwhelming on large PRs.
comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false

# Don't post to PRs that don't touch any covered file.
ignore:
  - "tests/"
  - "examples/"
  - "docs/"

flags:
  unit-integration:
    paths:
      - migrator/
    carryforward: false
  release:
    paths:
      - migrator/
    carryforward: false
