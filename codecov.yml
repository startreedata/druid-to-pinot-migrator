coverage:
  precision: 1
  round: nearest
  range: "85...95"

  status:
    # Project-wide gate: a PR is allowed to drop overall coverage by at
    # most 0.5 percentage points relative to the merge base. Anything
    # worse fails the check and blocks merging — keeps the metric from
    # silently rotting over time.
    project:
      default:
        target: auto
        threshold: 0.5%
        informational: false
    # Patch coverage (lines newly added/modified by the PR): require
    # that newly-introduced code is at least 80% covered. Refactors that
    # rearrange existing well-tested code are unaffected; brand-new
    # untested logic gets caught.
    patch:
      default:
        target: 80%
        threshold: 1.0%
        informational: false

# PR comments: keep it concise — header + diff coverage. The full
# per-file table is overwhelming on large PRs.
comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false

# Don't post to PRs that don't touch any covered file.
ignore:
  - "tests/"
  - "examples/"
  - "docs/"

flags:
  unit-integration:
    paths:
      - migrator/
    carryforward: false
  release:
    paths:
      - migrator/
    carryforward: false
