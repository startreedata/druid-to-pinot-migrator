# Pinot controller config — overrides the image default so the S3PinotFS
# factory is registered and pointed at our local MinIO. Used only by the
# tests/docker stack; production deployments configure this via Helm.
#
# When -configFileName is passed, the validator requires ALL the core
# settings here (it ignores the CLI flags for everything except a few
# overrides), so this file has to be self-contained — replicating the
# defaults the StartController CLI flags would have set.

# ─── Standard controller settings (would otherwise come from CLI flags) ──
controller.helix.cluster.name=migtest-pinot
controller.zk.str=zookeeper:2181
controller.host=migtest-pinot-controller
controller.port=9000
controller.access.protocols.http.port=9000
controller.data.dir=/var/pinot/controller

# ─── S3PinotFS for ingestFromURI ─────────────────────────────────────────
# Registers `s3` as a known scheme. The controller will dispatch any
# `s3://...` source URI to this factory at /ingestFromURI time; the file
# is read into the controller's local temp dir and the segment is built
# from there.
pinot.controller.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
pinot.controller.storage.factory.s3.region=us-east-1

# MinIO-specific overrides:
#  - ``endpoint`` redirects S3 SDK calls from AWS to our in-cluster
#    MinIO. The hostname ``minio`` is the docker-compose service name;
#    DNS resolution comes from the ``migtest`` bridge network.
#  - ``disableAcl`` is required because MinIO does not implement S3
#    ACLs and the SDK otherwise sends them on every PUT, which Pinot's
#    segment build would do for the segment.tar.gz it stages.
#  - Path-style addressing is mandatory — virtual-host style (bucket as
#    subdomain) needs DNS the local network doesn't provide.
pinot.controller.storage.factory.s3.endpoint=http://minio:9000
pinot.controller.storage.factory.s3.accessKey=minioadmin
pinot.controller.storage.factory.s3.secretKey=minioadmin
pinot.controller.storage.factory.s3.disableAcl=true
pinot.controller.storage.factory.s3.pathStyleAccess=true

# Allow the segment fetcher to follow s3 URIs as well — the URI-sink
# build path uses the storage factory directly, but keeping these aligned
# avoids a mismatch if the test ever exercises segment-side fetches.
controller.segment.fetcher.protocols=file,http,s3
controller.segment.fetcher.s3.class=org.apache.pinot.common.utils.fetcher.PinotFSSegmentFetcher
