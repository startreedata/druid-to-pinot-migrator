# ─────────────────────────────────────────────────────────────────────────────
# Auth-enabled Druid + Pinot stack.
#
# Identical layout to ../docker-compose.yml but with:
#   • Druid: druid-basic-security extension, basic authenticator/authorizer
#     chain. Admin user 'admin' / password 'admin'.
#   • Pinot: BasicAuthAccessControlFactory on controller and broker. Admin
#     user 'admin' / password 'admin'.
#
# Used by tests/docker/test_auth_live.py to validate the dpm CLI auth path.
#
# Ports (chosen NOT to overlap with the no-auth stack so both can run):
#   ZooKeeper:         12281
#   Kafka:             19292
#   Postgres:          15532
#   Druid coordinator: 18181
#   Druid broker:      18182
#   Druid historical:  18183
#   Druid middleMgr:   18191
#   Druid router:      18988
#   Pinot controller:  19100
#   Pinot broker:      18199
#   Pinot server:      18197/18198
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  metadata_data: {}
  druid_shared: {}
  coordinator_var: {}
  historical_var: {}
  broker_var: {}
  middlemanager_var: {}
  router_var: {}
  pinot_controller_data: {}

networks:
  authtest:
    driver: bridge

services:
  zookeeper:
    image: zookeeper:3.9.5
    container_name: authtest-zookeeper
    ports:
      - "12281:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,srvr"
    networks:
      - authtest
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: authtest-kafka
    ports:
      - "19292:19292"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19292"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19292"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    networks:
      - authtest
    mem_limit: 768m
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: authtest-postgres
    ports:
      - "15532:5432"
    environment:
      POSTGRES_PASSWORD: druid
      POSTGRES_USER: druid
      POSTGRES_DB: druid
    networks:
      - authtest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid"]
      interval: 5s
      timeout: 5s
      retries: 20

  coordinator:
    image: apache/druid:${DRUID_VERSION:-31.0.0}
    container_name: authtest-coordinator
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "18181:8081"
    command: coordinator
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - coordinator_var:/opt/druid/var
    networks:
      - authtest
    healthcheck:
      # Health endpoint is unauthenticated by default in druid-basic-security
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  broker:
    image: apache/druid:${DRUID_VERSION:-31.0.0}
    container_name: authtest-broker
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "18182:8082"
    command: broker
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - broker_var:/opt/druid/var
    networks:
      - authtest
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  historical:
    image: apache/druid:${DRUID_VERSION:-31.0.0}
    container_name: authtest-historical
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "18183:8083"
    command: historical
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - historical_var:/opt/druid/var
    networks:
      - authtest
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  middlemanager:
    image: apache/druid:${DRUID_VERSION:-31.0.0}
    container_name: authtest-middlemanager
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "18191:8091"
    command: middleManager
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - middlemanager_var:/opt/druid/var
    networks:
      - authtest
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  router:
    image: apache/druid:${DRUID_VERSION:-31.0.0}
    container_name: authtest-router
    depends_on:
      broker:
        condition: service_healthy
      historical:
        condition: service_healthy
      middlemanager:
        condition: service_healthy
    ports:
      - "18988:8888"
    command: router
    env_file:
      - druid.env
    volumes:
      - druid_shared:/opt/shared
      - router_var:/opt/druid/var
    networks:
      - authtest
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/status/health | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  pinot-controller:
    image: apachepinot/pinot:${PINOT_VERSION:-1.5.0}
    container_name: authtest-pinot-controller
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "19100:9000"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseG1GC"
    command: >
      StartController
      -configFileName /pinot-conf/controller.conf
    volumes:
      - pinot_controller_data:/var/pinot/controller
      - ./pinot-conf:/pinot-conf:ro
    networks:
      - authtest
    mem_limit: 1500m
    healthcheck:
      # /health is unauthenticated by Pinot's BasicAuth — checked first.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  pinot-broker:
    image: apachepinot/pinot:${PINOT_VERSION:-1.5.0}
    container_name: authtest-pinot-broker
    depends_on:
      pinot-controller:
        condition: service_healthy
    ports:
      - "18199:8099"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    command: >
      StartBroker
      -clusterName authtest-pinot
      -zkAddress zookeeper:2181
      -configFileName /pinot-conf/broker.conf
    volumes:
      - ./pinot-conf:/pinot-conf:ro
    networks:
      - authtest
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8099/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  pinot-server:
    image: apachepinot/pinot:${PINOT_VERSION:-1.5.0}
    container_name: authtest-pinot-server
    depends_on:
      pinot-controller:
        condition: service_healthy
    ports:
      - "18197:8097"
      - "18198:8098"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1500m -XX:+UseG1GC"
    command: >
      StartServer
      -zkAddress zookeeper:2181
      -clusterName authtest-pinot
    networks:
      - authtest
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8097/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
