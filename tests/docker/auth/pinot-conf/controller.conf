# Pinot controller — Basic auth enabled.
# Single principal 'admin' with password 'admin', full READ+WRITE.

# Cluster wiring (when -configFileName is used the CLI flags are ignored,
# so zk / cluster / dataDir / port have to live here)
controller.zk.str=zookeeper:2181
controller.helix.cluster.name=authtest-pinot
controller.port=9000
controller.data.dir=/var/pinot/controller
controller.host=authtest-pinot-controller

# BasicAuthAccessControl: every controller endpoint that's not unauthenticated
# (e.g. /health) requires Authorization: Basic base64("admin:admin")
controller.admin.access.control.factory.class=org.apache.pinot.controller.api.access.BasicAuthAccessControlFactory
controller.admin.access.control.principals=admin
controller.admin.access.control.principals.admin.password=admin

# Same auth for the controller→server / controller→broker REST calls.
pinot.controller.segment.fetcher.auth.token=Basic YWRtaW46YWRtaW4=
pinot.controller.storage.factory.auth.token=Basic YWRtaW46YWRtaW4=
