# Pinot broker — Basic auth enabled. Same admin/admin credential as the
# controller so a single token can be used end-to-end.

pinot.zk.server=zookeeper:2181
pinot.cluster.name=authtest-pinot

pinot.broker.client.access.protocols=http
pinot.broker.client.access.protocols.http.port=8099

pinot.broker.access.control.class=org.apache.pinot.broker.broker.BasicAuthAccessControlFactory
pinot.broker.access.control.principals=admin
pinot.broker.access.control.principals.admin.password=admin
